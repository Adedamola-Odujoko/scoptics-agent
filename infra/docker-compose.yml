# The top-level 'version' key has been removed as it is now obsolete.

services:
  db:
    image: imresamu/postgis-arm64:15-3.4-alpine
    container_name: scoptics-db
    platform: linux/arm64
    environment:
      POSTGRES_USER: scoptics_user
      POSTGRES_PASSWORD: scoptics_password
      POSTGRES_DB: scoptics_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # ** THE FIX (Part 1): Use a named volume, not a bind mount **
      # The './' has been removed.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoptics_user -d scoptics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  vector_db:
    image: semitechnologies/weaviate:1.24.1
    platform: linux/arm64
    container_name: scoptics-vector-db
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - weaviate-data:/var/lib/weaviate
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"

# ** THE FIX (Part 2): Define the named volumes **
# This tells Docker to manage these volumes itself.
volumes:
  postgres-data:
  weaviate-data:
